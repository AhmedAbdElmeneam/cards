<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#f4f5fb">
<meta name="robots" content="noindex"><meta name="referrer" content="no-referrer">
<title>Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=DM+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Alexandria:wght@500;600;700&display=swap">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="edit.css">
<link rel="stylesheet" href="admin.css">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} img{max-width:100%}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}}
</style>
</head>
<body class="ed">
<div id="cp-login" class="ed-login" hidden>
  <div class="ed-card ed-login-card cp-login-card">
    <div class="ed-logo">SoulID</div>
    <h1>لوحة التحكم</h1>
    <p>ادخل بحساب Google بتاع صاحب البراند.</p>
    <button class="ed-btn primary" id="cp-google" type="button">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z" opacity=".9"/><path fill="currentColor" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z" opacity=".7"/><path fill="currentColor" d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1a10 10 0 0 0 0 9.2z" opacity=".5"/><path fill="currentColor" d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.4L6.4 10C7.2 7.7 9.4 5.9 12 5.9z" opacity=".8"/></svg>
      الدخول بـ Google
    </button>
    <p class="ed-err" id="cp-login-msg" role="alert"></p>
  </div>
</div>

<div id="cp-app" hidden>
  <header class="ed-top">
    <div class="ed-brand"><span class="ed-logo">SoulID</span><span class="ed-title">لوحة التحكم</span></div>
    <span class="ed-mode cloud" id="cp-user"></span>
    <div class="ed-actions"><button class="ed-btn ghost" id="cp-out" type="button">خروج</button></div>
  </header>

  <div class="cp-main">
    <section class="ed-card">
      <h2><span>+</span>عميل جديد</h2>
      <p class="ed-sub">كل عميل بيطلعله كود تعديل جديد عشوائي في ساعتها، ومحدش يقدر يخمّنه.</p>
      <form id="n-form" class="cp-form" autocomplete="off">
        <div><label for="n-name">اسم العميل</label><input class="ed-in" id="n-name" placeholder="منى علي" required></div>
        <div><label for="n-slug">الرابط (إنجليزي)</label><input class="ed-in" id="n-slug" dir="ltr" placeholder="mona" pattern="[a-z0-9-]{3,30}"></div>
        <div><label for="n-tpl">القالب</label><select class="ed-in" id="n-tpl">
          <option value="classic">كلاسيك</option><option value="couple">كابلز</option><option value="grad">مشروع تخرج / رسالة</option><option value="dev">مطوّر / برمجة</option></select></div>
        <button class="ed-btn primary" id="n-go" type="submit">اعمل عميل جديد</button>
      </form>
      <p class="ed-err" id="n-err" role="alert"></p>
      <div id="n-result" class="cp-result" hidden></div>
    </section>

    <section class="ed-card">
      <div class="cp-head"><h2><span id="cp-count">0</span>العملاء</h2><input class="ed-in cp-search" id="cp-search" placeholder="دوّر بالاسم أو الرابط"></div>
      <div id="cp-list" class="cp-list"></div>
    </section>
  </div>
  <div class="ed-toast" id="cp-toast" role="status" aria-live="polite"></div>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="tpl.js"></script>
<script src="admin.js"></script>

</body>
</html>
